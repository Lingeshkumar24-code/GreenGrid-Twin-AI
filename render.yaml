services:
  - type: web
    name: greengrid-twin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-cpu.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: VISION_MODEL_WEIGHTS
        value: yolo26n.pt
      - key: VISION_CONFIDENCE
        value: "0.35"
      - key: VISION_SAMPLE_EVERY
        value: "5"
      - key: VISION_MAX_UPLOAD_MB
        value: "50"
      - key: VISION_MAX_VIDEO_SECONDS
        value: "120"
      - key: VISION_EMPTY_CONFIRM_SECONDS
        value: "60"
